[project]
name = "{{name}}"
version = "0.1.0"
description = "An MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=1.2,<2"]

[project.scripts]
{{name}} = "{{pkg}}.__main__:main"

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=1.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{pkg}}"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
